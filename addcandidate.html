<!DOCTYPE html>
<html>
  <head>
    <title>ADD CANDIDATE</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <style>
      body{
      
      background-image: url("/static/home.jpg") ;
      background-size: 100%;
      background-repeat: no-repeat;
      background-position-y: 40px;
      
      }
          </style>
  </head>
  <body >
    <nav>
      <ul>
        <li><a  href="/">LOGOUT</a></li>
        <li><a  href="registerpage">VOTER REGISTER</a></li>
        <li><a href="viewvotecountspage" >VIEW VOTE COUNTS</a></li>
        <li><a href="viewconstituenciespage" >VIEW CONSTITUENCIES</a></li>
        <li><a href="addconstituencypage" >ADD CONSTITUENCY</a></li>
        <li><a href="viewcandidatespage" >VIEW CANDIDATES</a></li>
        <li><a href="addcandidatepage" class="active">ADD CANDIDATE</a></li>
        
      </ul>
    </nav>
    <div id="google_translate_element"></div>
<br><br>

    <div class="form">
      <h2>ADD CANDIDATE</h2>
      <div class="flashes">
        {% for message in get_flashed_messages() %}
          {{ message }}
        {% endfor %}
      </div>
      <form action="savecandidate" method="POST" enctype="multipart/form-data">
        
        <label for="name">NAME:</label>
        <input type="text" id="name" name="name" required>

        <label for="party">PARTY:</label>
        <input type="text" id="party" name="party" required>

        <label for="constitution">CONSTITUTION:</label>
        
       <select name="cid">
        {% for r in res %}
        <option value="{{r[0]}}">{{r[1]}}</option>
        {% endfor %}

       </select>

        <label for="cimage">CHOOSE IMAGE:</label>
        <input type="file" name="photo" accept="image/*" required>

        <input type="submit" value="SUBMIT">
      </form>
    </div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
      }
      </script>
        <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
